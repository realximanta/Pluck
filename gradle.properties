# Pluck — Gradle build tuning.
#
# Kept minimal on purpose. Every non-default here is there because it makes a
# real difference for either CI time or Android build reliability.

# JVM heap for the Gradle daemon. 2 GB is enough for this project; 4 GB wastes
# RAM on Render/CI runners where we share CPU. Bump only if OOM appears.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Parallel project builds. Only one module (:app) right now, so this is a
# no-op today, but free when we add :core or similar later.
org.gradle.parallel=true

# Build cache. Speeds up incremental CI builds dramatically once warm.
org.gradle.caching=true

# Configuration cache. Cuts 20-40% off build times by skipping the
# configuration phase on subsequent runs. Safe with AGP 8.7.x.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# AndroidX only. Required for AGP 8.x — without this, build fails at
# configuration time with "This project uses AndroidX dependencies".
android.useAndroidX=true

# Faster resource IDs per-module. Saves ~10% on R class bytecode size.
android.nonTransitiveRClass=true

# Kotlin incremental compilation. Cuts rebuild times on repeated edits.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# Kotlin official code style. No effect on the build, only IDE formatting
# suggestions — keeps future contributions consistent.
kotlin.code.style=official

# Suppress the AGP 8.x warning about buildConfig being required but disabled.
# We set buildConfig = true explicitly in app/build.gradle.kts.
android.defaults.buildfeatures.buildconfig=false
